url: "https://galt-k.github.io"
baseurl: "/galt-tech"
title: GaltSystems
description: "A personal notebook on engineering, business, and art."
author:
  name: "Galt K"
permalink: /:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      topic: Engineering
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
